<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Radial Glow -->
  <circle cx="256" cy="240" r="180" fill="#06b6d4" opacity="0.12" />

  <!-- Shield Outer Border -->
  <path d="M256 68 L400 132 C400 280 340 376 256 428 C172 376 112 280 112 132 Z" 
        fill="#0f172a" 
        stroke="url(#shieldGrad)" 
        stroke-width="14" 
        stroke-linejoin="round" />

  <!-- Shield Inner Layer -->
  <path d="M256 94 L378 148 C378 268 328 350 256 396 C184 350 134 268 134 148 Z" 
        fill="#1e293b" 
        opacity="0.6" />

  <!-- Radar Rings -->
  <circle cx="256" cy="240" r="75" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="240" r="45" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.5" />

  <!-- Futuristic Cyber Crosshair lines -->
  <line x1="256" y1="180" x2="256" y2="300" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  <line x1="196" y1="240" x2="316" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.3" />

  <!-- Central Verification Checkmark & Shield Core -->
  <path d="M208 242 L242 276 L314 198" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing Pulse Core -->
  <circle cx="242" cy="276" r="6" fill="#ffffff" />
  <circle cx="314" cy="198" r="6" fill="#38bdf8" />
  <circle cx="208" cy="242" r="6" fill="#06b6d4" />
</svg>
